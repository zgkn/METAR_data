name: METAR Southeast Asia

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date in SGT (YYYY-MM-DD)"
        required: true
        default: "2026-10-18"
        type: string
      overwrite:
        description: "Overwrite existing output files for this date"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# One run at a time so commits don't race.
concurrency:
  group: metar-sea
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Fetch METAR from IEM
        env:
          SGT_DATE: ${{ inputs.date }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          args=(--date "$SGT_DATE" --outdir data/metar)
          if [ "$OVERWRITE" = "true" ]; then args+=(--overwrite); fi
          python scripts/fetch_metar_sea.py "${args[@]}"

      - name: Job summary
        if: success()
        env:
          SGT_DATE: ${{ inputs.date }}
        run: |
          {
            echo '```'
            cat "data/metar/metar_sea_${SGT_DATE}_summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit outputs
        if: success()
        env:
          SGT_DATE: ${{ inputs.date }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metar
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          msg="Add METAR observations for Southeast Asia, ${SGT_DATE} SGT"
          if [ "$OVERWRITE" = "true" ]; then msg="$msg (overwrite enabled)"; fi
          git commit -m "$msg"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
